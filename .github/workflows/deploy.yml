# Builds, tests and deploys Tedd.MOS65xx.
#
# Triggered by pushes to the "deploy" branch (and manually). Produces:
#   * a GitHub Release "build-<run>" (marked latest) with the self-contained Windows WPF build
#     (Tedd.MOS65xx-win-x64.zip), the SDL2 front-end for Windows and Linux, and the Unity package
#   * the Blazor WebAssembly site published to GitHub Pages (Settings > Pages > Source must be "GitHub Actions")
#
# ROM images are never part of the repository. The web build ships OpenROMs (LGPL-3, MEGA65/open-roms) as the
# default free ROM set when tools/fetch-openroms.sh succeeds; users can upload their own ROMs in the browser.

name: Deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 11.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RELEASE_TAG: build-${{ github.run_number }}

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      # The test project pulls in the emulator core, the hosting layer and the Unity facade; the front-ends are
      # built by their own jobs (the Blazor project would additionally need the wasm-tools workload here).
      - name: Build
        run: dotnet build src/Tedd.MOS65xx.Tests/Tedd.MOS65xx.Tests.csproj -c Release
      - name: Test (fast suite; ROM-dependent tests skip themselves)
        run: dotnet test src/Tedd.MOS65xx.Tests/Tedd.MOS65xx.Tests.csproj -c Release --no-build --filter "Category!=Slow&Category!=Harte&Category!=Lorenz" --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/Tedd.MOS65xx.Tests/TestResults/*.trx
          if-no-files-found: ignore

  windows:
    name: Windows builds
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - name: Publish WPF front-end (self-contained, single file)
        run: dotnet publish src/Tedd.MOS65xx.GUI/Tedd.MOS65xx.GUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/win-x64
      - name: Publish SDL2 front-end (Windows)
        run: dotnet publish src/Tedd.MOS65xx.Sdl/Tedd.MOS65xx.Sdl.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -o publish/sdl-win-x64
      - name: Unity package (netstandard2.1 DLLs)
        shell: pwsh
        run: |
          if (Test-Path tools/build-unity-package.ps1) { ./tools/build-unity-package.ps1 } else { Write-Host "no unity package script" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md, LICENSE publish/win-x64/
          Copy-Item README.md, LICENSE publish/sdl-win-x64/
          Compress-Archive -Path publish/win-x64/* -DestinationPath dist/Tedd.MOS65xx-win-x64.zip
          Compress-Archive -Path publish/sdl-win-x64/* -DestinationPath dist/Tedd.MOS65xx-sdl-win-x64.zip
          if (Test-Path unity/com.tedd.mos65xx/Runtime/Plugins/Tedd.MOS65xx.Emulator.dll) {
            Compress-Archive -Path unity/com.tedd.mos65xx -DestinationPath dist/Tedd.MOS65xx-unity-package.zip
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Build ${{ github.run_number }}
          make_latest: true
          body: |
            Automated build of commit ${{ github.sha }}.

            * `Tedd.MOS65xx-win-x64.zip` - Windows desktop emulator (WPF). Put your ROM images in a `roms` folder next to the exe (see README).
            * `Tedd.MOS65xx-sdl-win-x64.zip` / `Tedd.MOS65xx-sdl-linux-x64.tar.gz` - SDL2 front-end.
            * `Tedd.MOS65xx-unity-package.zip` - Unity (UPM) package with the netstandard2.1 assemblies.
          files: dist/*.zip

  linux-sdl:
    name: SDL2 front-end (Linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - name: Publish
        run: dotnet publish src/Tedd.MOS65xx.Sdl/Tedd.MOS65xx.Sdl.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=none -o publish/sdl-linux-x64
      - name: Package
        run: |
          mkdir -p dist
          cp README.md LICENSE publish/sdl-linux-x64/
          tar -C publish -czf dist/Tedd.MOS65xx-sdl-linux-x64.tar.gz sdl-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*.tar.gz
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Build ${{ github.run_number }}
          files: dist/*.tar.gz

  web:
    name: Web (Blazor WebAssembly) to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools --skip-manifest-update || dotnet workload install wasm-tools
      - name: Fetch OpenROMs (free ROM set for the online demo)
        continue-on-error: true
        run: |
          chmod +x tools/fetch-openroms.sh
          ./tools/fetch-openroms.sh
      - name: Publish
        run: dotnet publish src/Tedd.MOS65xx.Web/Tedd.MOS65xx.Web.csproj -c Release -o publish/web
      - name: Prepare for GitHub Pages
        run: |
          WWW=publish/web/wwwroot
          # The site lives under https://<user>.github.io/<repo>/ so the base href must be the repo path.
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" */>|<base href=\"/$REPO/\" />|" "$WWW/index.html"
          if [ -f "$WWW/404.html" ]; then sed -i "s|<base href=\"/\" */>|<base href=\"/$REPO/\" />|" "$WWW/404.html"; fi
          touch "$WWW/.nojekyll"
          ls -la "$WWW"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/web/wwwroot
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
