<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tedd.MOS65xx - a cycle-exact Commodore 64 emulator written in C#, running in your browser via Blazor WebAssembly." />
    <meta name="theme-color" content="#101418" />
    <title>Tedd.MOS65xx - a cycle-exact Commodore 64 emulator in C#</title>
    <!--
        Base path. Locally and on a root-hosted site the base href below is "/". The GitHub Pages deploy job
        publishes under /Tedd.MOS65xx/ and rewrites the href of this tag (and of the same tag in 404.html) to
        "/Tedd.MOS65xx/" with sed after `dotnet publish` (exact command in README.md). Everything else (framework
        files, js/c64.js, roms/*.bin) is loaded relative to the base, so nothing else needs to change.
    -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script type="importmap"></script>

    <!--
        Page effects (site presentation only - the emulator itself uses js/c64.js). GSAP 3.15.0 is vendored
        under js/vendor/gsap (see the README there) so nothing is fetched from a CDN. Order matters: the core
        first, then the plugins, then js/effects.js which registers them. "defer" keeps them out of the
        critical path and guarantees they run in this order before DOMContentLoaded; effects.js then waits for
        Blazor to render the page. If any of these fail to load the site simply stays static.
        "#[.{fingerprint}]" is replaced at build time with the asset's content hash (OverrideHtmlAssetPlaceholders
        in the .csproj), so a changed file is never served from a stale browser cache; if it were ever left
        unreplaced it is just a URL fragment and the plain file still loads.
    -->
    <script defer src="js/vendor/gsap/gsap.min#[.{fingerprint}].js"></script>
    <script defer src="js/vendor/gsap/ScrollTrigger.min#[.{fingerprint}].js"></script>
    <script defer src="js/vendor/gsap/ScrollToPlugin.min#[.{fingerprint}].js"></script>
    <script defer src="js/vendor/gsap/TextPlugin.min#[.{fingerprint}].js"></script>
    <script defer src="js/vendor/gsap/SplitText.min#[.{fingerprint}].js"></script>
    <script defer src="js/effects#[.{fingerprint}].js"></script>
    <script>
        // GitHub Pages SPA fallback: 404.html redirects unknown paths to the base with "?p=<path>"; restore it.
        (function () {
            var p = new URLSearchParams(location.search).get("p");
            if (p) history.replaceState(null, "", document.baseURI.replace(/\/$/, "") + p + location.hash);
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot-screen">
                <p>**** TEDD.MOS65XX WEB ****</p>
                <p>LOADING .NET WEBASSEMBLY, PLEASE WAIT<span class="boot-progress-text"></span></p>
                <p class="blink">&#9608;</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#128473;</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
