<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Tedd.MOS65xx</title>
    <!-- Rewritten by the deploy job together with index.html (see the comment there). -->
    <base href="/" />
    <script>
        // GitHub Pages serves this file for every unknown path. Send the browser to the app root and pass the
        // requested path along as "?p=", where index.html puts it back into the address bar (history.replaceState)
        // so Blazor's router sees the original URL. The app root is whatever <base href> says.
        (function () {
            var base = new URL(document.baseURI);
            var rest = location.pathname.startsWith(base.pathname) ? location.pathname.slice(base.pathname.length - 1) : location.pathname;
            var target = base.origin + base.pathname + "?p=" + encodeURIComponent(rest + location.search) + location.hash;
            location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="./">Tedd.MOS65xx</a>…</p>
</body>
</html>
